# Azure Pipeline - Deploy to AKS Only
# Use this when image is already in ACR

trigger: none  # Manual trigger only

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Azure Resources
  resourceGroup: 'rg-aks-devsecops-demo'
  aksCluster: 'aks-devsecops-demo'
  acrName: 'acrdevsecopsdemo'
  keyVaultName: 'kvdevsecopsdemo'

  # Deployment Configuration
  namespace: 'voting-app'
  helmReleaseName: 'azure-vote'
  imageName: 'azure-vote'
  imageTag: 'v1'  # Change this to your image tag

  # Helm Chart Path
  helmChartPath: 'Assignment/azure-vote-chart-simple'

  # Service Connection Names (UPDATE THESE!)
  azureServiceConnection: 'azure-service-connection'
  kubernetesServiceConnection: 'aks-service-connection'

stages:
  - stage: Deploy
    displayName: 'Deploy to AKS'
    jobs:
      - deployment: DeployHelm
        displayName: 'Deploy with Helm'
        environment: 'AKS-Voting-App'
        strategy:
          runOnce:
            deploy:
              steps:
                # Checkout code
                - checkout: self

                # Install Helm
                - task: HelmInstaller@1
                  displayName: 'Install Helm'
                  inputs:
                    helmVersionToInstall: 'latest'

                # Get AKS credentials
                - task: AzureCLI@2
                  displayName: 'Get AKS Credentials'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      echo "Connecting to AKS cluster..."
                      az aks get-credentials \
                        --resource-group $(resourceGroup) \
                        --name $(aksCluster) \
                        --overwrite-existing

                      echo "✅ Connected to AKS"
                      kubectl cluster-info

                # Get Configuration Values from Azure
                - task: AzureCLI@2
                  displayName: 'Get Azure Configuration'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      # Get Tenant ID
                      TENANT_ID=$(az account show --query tenantId -o tsv)
                      echo "Tenant ID: $TENANT_ID"
                      echo "##vso[task.setvariable variable=tenantId]$TENANT_ID"

                      # Get Workload Identity Client ID
                      WORKLOAD_CLIENT_ID=$(az identity show \
                        --name aks-workload-identity \
                        --resource-group $(resourceGroup) \
                        --query clientId -o tsv)
                      echo "Workload Identity Client ID: $WORKLOAD_CLIENT_ID"
                      echo "##vso[task.setvariable variable=workloadClientId]$WORKLOAD_CLIENT_ID"

                # Update Helm Dependencies
                - task: Bash@3
                  displayName: 'Update Helm Dependencies'
                  inputs:
                    targetType: 'inline'
                    workingDirectory: '$(helmChartPath)'
                    script: |
                      echo "Updating Helm chart dependencies..."
                      helm dependency update
                      echo "✅ Dependencies updated"

                # Deploy with Helm
                - task: Bash@3
                  displayName: 'Deploy with Helm'
                  inputs:
                    targetType: 'inline'
                    script: |
                      echo "=========================================="
                      echo "Deploying Azure Vote to AKS"
                      echo "=========================================="
                      echo "Namespace: $(namespace)"
                      echo "Release: $(helmReleaseName)"
                      echo "Image: $(acrName).azurecr.io/$(imageName):$(imageTag)"
                      echo "=========================================="

                      helm upgrade --install $(helmReleaseName) $(helmChartPath) \
                        --namespace $(namespace) \
                        --create-namespace \
                        --set image.repository=$(acrName).azurecr.io/$(imageName) \
                        --set image.tag=$(imageTag) \
                        --set keyVault.name=$(keyVaultName) \
                        --set keyVault.tenantId=$(tenantId) \
                        --set keyVault.clientId=$(workloadClientId) \
                        --wait \
                        --timeout 10m

                      echo "✅ Helm deployment completed"

                # Verify Deployment
                - task: Bash@3
                  displayName: 'Verify Deployment'
                  inputs:
                    targetType: 'inline'
                    script: |
                      echo "=========================================="
                      echo "Verifying Deployment"
                      echo "=========================================="

                      # Check Helm release
                      echo "Helm release status:"
                      helm list -n $(namespace)

                      echo ""
                      echo "Waiting for pods to be ready..."
                      kubectl wait --for=condition=ready pod \
                        -l app=azure-vote \
                        -n $(namespace) \
                        --timeout=300s || true

                      echo ""
                      echo "All resources in namespace:"
                      kubectl get all -n $(namespace)

                      echo ""
                      echo "Pod status:"
                      kubectl get pods -n $(namespace) -o wide

                # Get Service Endpoint
                - task: Bash@3
                  displayName: 'Get Application URL'
                  inputs:
                    targetType: 'inline'
                    script: |
                      echo "=========================================="
                      echo "Getting Application URL"
                      echo "=========================================="

                      # Wait for LoadBalancer IP
                      echo "Waiting for LoadBalancer IP (may take 2-3 minutes)..."

                      EXTERNAL_IP=""
                      for i in {1..60}; do
                        EXTERNAL_IP=$(kubectl get svc azure-vote -n $(namespace) -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
                        if [ -n "$EXTERNAL_IP" ]; then
                          break
                        fi
                        echo "Waiting... ($i/60)"
                        sleep 5
                      done

                      if [ -n "$EXTERNAL_IP" ]; then
                        echo ""
                        echo "=========================================="
                        echo "✅ Deployment Successful!"
                        echo "=========================================="
                        echo "Application URL: http://$EXTERNAL_IP"
                        echo "=========================================="
                        echo ""
                        echo "Test the application:"
                        echo "  curl http://$EXTERNAL_IP"
                        echo ""
                      else
                        echo ""
                        echo "⚠️ LoadBalancer IP not yet assigned"
                        echo "Run manually: kubectl get svc azure-vote -n $(namespace)"
                      fi

                # Show Logs (for troubleshooting)
                - task: Bash@3
                  displayName: 'Show Application Logs'
                  condition: always()
                  inputs:
                    targetType: 'inline'
                    script: |
                      echo "=========================================="
                      echo "Application Logs (last 50 lines)"
                      echo "=========================================="
                      kubectl logs -l app=azure-vote -n $(namespace) --tail=50 || echo "No logs available yet"
