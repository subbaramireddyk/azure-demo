apiVersion: v1
kind: Service
metadata:
  name: {{ include "azure-vote.fullname" . }}
  labels:
    {{- include "azure-vote.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: {{ include "azure-vote.name" . }}
