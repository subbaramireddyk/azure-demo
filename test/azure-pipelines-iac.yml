trigger:
  branches:
    include:
    - master
  paths:
    include:
    - terraform/*

pool:
  name: az-agentpool

variables:
  # Set these as pipeline variables or use Azure DevOps Library for secrets
  # TF_VAR_resource_group_name: 'rg-aks-devsecops-demo'
  # TF_VAR_location: 'southindia'
  # TF_VAR_acr_name: 'acrdevsecopsdemo'
  # TF_VAR_acr_sku: 'Basic'
  # TF_VAR_acr_admin_enabled: false
  # TF_VAR_aks_name: 'aks-devsecops-demo'
  # TF_VAR_aks_dns_prefix: 'aksdevsecopsdemo'
  # TF_VAR_aks_node_count: 1
  # TF_VAR_aks_vm_size: 'Standard_D2s_v3'
  # TF_VAR_keyvault_name: 'kvdevsecopsdemo'
  # TF_VAR_tenant_id: '<your-tenant-id>' # Replace with actual tenant id or use secret
  # TF_VAR_keyvault_sku: 'standard'
  # TF_VAR_storage_name: 'stdevsecopsdemo'
  # TF_VAR_storage_account_tier: 'Standard'
  # TF_VAR_storage_account_replication_type: 'LRS'

stages:
  - stage: IaC
    displayName: 'Infrastructure as Code'
    jobs:
      - job: Terraform
        displayName: 'Terraform Provision'
        steps:
          - task: AzureCLI@2
            displayName: 'Azure Login'
            inputs:
              azureSubscription: 'terraform-sp-connection'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az --version

          - script: |
              if ! command -v terraform >/dev/null 2>&1; then
                echo "Terraform not found, installing..."
                curl -sL https://releases.hashicorp.com/terraform/1.6.6/terraform_1.6.6_linux_amd64.zip -o terraform.zip
                unzip -o terraform.zip
                sudo mv terraform /usr/local/bin/
              else
                echo "Terraform already installed: $(terraform version | head -n 1)"
              fi
              terraform version
            displayName: 'Install Terraform if Needed'

          - script: |
              terraform init
            workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
            displayName: 'Terraform Init'

          - script: |
              terraform plan -out=tfplan -var-file=terraform.tfvars
            workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
            displayName: 'Terraform Plan'

          - task: ManualValidation@0
            displayName: 'Manual Approval Before Apply'
            inputs:
              instructions: 'Please review the Terraform plan output above. Approve to proceed with apply.'
              onTimeout: 'reject'
              timeout: '1d'

          - script: |
              terraform apply -auto-approve -var-file=terraform.tfvars tfplan
            workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
            displayName: 'Terraform Apply'
